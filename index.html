<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- tag is an HTML setting that makes web pages responsive and readable on mobile devices -->
        <title>ScoreBoard</title>
        <link rel="stylesheet" href="styles.css">
    </head>   
    <body>
        <div class="container">

            <div class="home">
                <h1>HOME</h1>
                <h2 id="homeScore">0</h2>
                <button id="homeOne" onclick="homeOne()">+1</button>
                <button id="homeTwo" onclick="homeTwo()">+2</button>
                <button id="homeThree" onclick="homeThree()">+3</button>
            </div>

            <div class="timer">
                <h3 id="timer">00:00</h3>
                <div>
                    <button class="timerBtn">START</button>
                    <button class="timerBtn">END</button>
                </div>
            </div>

            <div class="guest">
                <h1>GUEST</h1>
                <h2 id="awayScore">0</h2>
                <button id="awayOne" onclick="awayOne()">+1</button>
                <button id="awayTwo" onclick="awayTwo()">+2</button>
                <button id="awayThree" onclick="awayThree()">+3</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
